<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#080809">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Member | Starpoint Garage</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#080809;color:#f6f5f3;display:grid;place-items:center}
main{width:min(100% - 40px,420px);padding:34px 24px 36px;text-align:center;border:1px solid #302c2e;border-radius:22px;background:#151416}
img{display:block;width:min(240px,80%);height:auto;margin:0 auto 26px}
h1{font-size:20px;line-height:1.3;margin:0 0 8px}
p{font-size:14px;color:#b8b6bb;line-height:1.6;margin:0}
.bar{width:56px;height:4px;margin:23px auto 0;border-radius:99px;background:linear-gradient(90deg,#df2b3b,#f4c44f,#df2b3b);background-size:200% 100%;animation:move 1.3s linear infinite}
@keyframes move{to{background-position:-200% 0}}
a{color:#f6d27f}
.small{margin-top:22px;font-size:12px}
</style>
</head>
<body>
<main role="status" aria-live="polite">
<img src="/assets/starpoint-official.svg" alt="Starpoint Garage" width="300" height="96">
<h1>Membuka Starpoint Member</h1>
<p>Menghubungkan ke sistem Member Starpoint Garage.</p>
<div class="bar" aria-hidden="true"></div>
<p class="small">Jika ada gangguan, <a href="/member-backup.html" id="manualFallback">buka versi cadangan</a>.</p>
<noscript><p>Aktifkan JavaScript atau <a href="/member-backup.html">buka Member</a>.</p></noscript>
</main>
<script>
(function () {
  "use strict";
  var endpoint = "https://msvdxyicostwztisvbvl.supabase.co/functions/v1/member-app";
  var fallback = "/member-backup.html";
  var serviceAssets = {
    SIGNATURE_WASH:"/assets/app-services/signature-wash.webp",
    PAINT_CORRECTION:"/assets/app-services/paint-correction.webp",
    DEEP_DETAILING:"/assets/app-services/deep-detailing.webp",
    NANO_COATING_10H:"/assets/app-services/nano-coating-10h.webp",
    FULL_BODY_REPAINT:"/assets/app-services/full-body-repaint.webp",
    HELMET_CARE:"/assets/app-services/helmet-care.webp",
    WHEEL_REPAINT:"/assets/app-services/wheel-repaint.webp",
    DEEP_TAR_REMOVAL:"/assets/app-services/deep-tar-removal.webp",
    DEEP_RUST_REMOVER:"/assets/app-services/deep-rust-remover.webp",
    ULTIMATE_DEGREASER:"/assets/app-services/ultimate-degreaser.webp",
    ALL_IN_ALA_CARTE:"/assets/app-services/all-in-ala-carte.webp",
    CAR_CARE:"/assets/app-services/car-care.webp"
  };
  var websiteFixes = '<style id="spg-live-member-web-fixes">' +
    'html:not(.spg-native) body #mainScreen .topbar{top:env(safe-area-inset-top,0px)!important}' +
    'html:not(.spg-native) body #mainScreen .topbar::before{height:env(safe-area-inset-top,0px)!important}' +
    'html:not(.spg-native) body #mainScreen{padding-top:calc(100px + env(safe-area-inset-top,0px))!important}' +
    '</style>';
  function prepare(page) {
    if (typeof page !== "string" || page.length < 10000 || page.length > 5000000 ||
        !page.includes('id="authScreen"') || !page.includes('id="mainScreen"') ||
        !page.includes("msvdxyicostwztisvbvl.supabase.co")) {
      throw new Error("The Member app did not return valid Starpoint HTML");
    }
    if (/<base\b/i.test(page)) page = page.replace(/<base\b[^>]*>/i, '<base href="/">');
    else page = page.replace(/<head>/i, '<head><base href="/">');
    page = page.replace(/<title>[^<]*<\/title>/i, '<title>Member | Starpoint Garage</title>');
    page = page.replace(/maximum-scale=1,user-scalable=no,?/i, "");
    page = page.replace('https://starpointgarage.com/assets/images/location/outlet-full.webp', '/assets/store.webp');
    Object.entries(serviceAssets).forEach(function (entry) {
      var name = entry[0], path = entry[1];
      var pattern = new RegExp("(\\b" + name + "\\s*:\\s*)['\"]data:image/webp;base64,[A-Za-z0-9+/=]+['\"]");
      page = page.replace(pattern, function (_, prefix) { return prefix + "'" + path + "'"; });
    });
    page = page.replace(/<head>/i,
      '<head><meta name="spg-ui-source" content="live-supabase">' +
      '<meta name="robots" content="noindex,nofollow">' +
      '<meta name="referrer" content="strict-origin-when-cross-origin">' +
      '<link rel="icon" type="image/svg+xml" href="/favicon.svg">');
    page = page.replace(/<\/head>/i, websiteFixes + '</head>');
    var routing = '<scr' + 'ipt id="spg-website-member-deeplink">' +
      '(function(){try{var p=new URLSearchParams(location.search);' +
      'if(p.get("mode")==="daftar"){var a=document.getElementById("authScreen");' +
      'var b=document.querySelector("#authTabs button[data-auth=register]");' +
      'if(a&&b&&!a.classList.contains("hidden"))b.click();}' +
      '}catch(e){}})();' + '</scr' + 'ipt>';
    page = page.replace(/<\/body>/i, routing + '</body>');
    return page;
  }
  var originalFallback = document.getElementById("manualFallback");
  originalFallback.href = fallback + location.search + location.hash;
  var controller = new AbortController();
  var timeout = setTimeout(function () { controller.abort(); }, 14000);
  fetch(endpoint, {method:"GET",mode:"cors",credentials:"omit",cache:"no-store",signal:controller.signal})
    .then(function (response) {
      if (!response.ok || !(response.headers.get("content-type") || "").toLowerCase().includes("text/html"))
        throw new Error("Member app is temporarily unavailable");
      return response.text();
    })
    .then(function (source) {
      var page = prepare(source);
      document.open();
      document.write(page);
      document.close();
    })
    .catch(function () { location.replace(fallback + location.search + location.hash); })
    .finally(function () { clearTimeout(timeout); });
})();
</script>
</body>
</html>
