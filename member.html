async function refreshSession(){
  if(memberRefreshPromise)return memberRefreshPromise;
  memberRefreshPromise=(async()=>{
    if(!state.session?.refresh_token)throw new Error('SESSION_EXPIRED');
    const d=await jsonFetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY},body:JSON.stringify({refresh_token:state.session.refresh_token})});
    state.session={access_token:d.access_token,refresh_token:d.refresh_token};
    localStorage.setItem('spg_member_session',JSON.stringify(state.session));
  })();
  try{return await memberRefreshPromise;}finally{memberRefreshPromise=null;}
}
async function rpc(name,params={},retry=true){
  if(!state.session?.access_token)throw new Error('SESSION_EXPIRED');
  const tokenUsed=state.session.access_token;
  try{return await jsonFetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY,'Authorization':'Bearer '+tokenUsed},body:JSON.stringify(params)});}
  catch(e){
    if(retry&&/JWT|401|expired|token/i.test(e.message)){
      if(state.session?.access_token===tokenUsed)await refreshSession();
      return rpc(name,params,false);
    }
    throw e;
  }
}

async function enterApp(){
  try{
    await loadAll();
    $('#authScreen').classList.add('hidden');
    $('#mainScreen').classList.remove('hidden');
    document.documentElement.classList.remove('spg-restoring-session');
    render();
    startMemberSync();
    return true;
  }catch(e){
    const reason=String(e?.message||e||'');
    const invalidSession=/SESSION_EXPIRED|invalid.grant|invalid.refresh|refresh.token.not.found|account.inactive|invalid.jwt|jwt.*(expired|invalid)|unauthoriz|^401$/i.test(reason);
    document.documentElement.classList.remove('spg-restoring-session');
    if(invalidSession){
      clearSession();
      $('#mainScreen').classList.add('hidden');
      $('#authScreen').classList.remove('hidden');
      $('#authMsg').textContent=errText(e);
    }else{
      // Jaringan/server sementara bermasalah bukan berarti pengguna harus login lagi.
      $('#authScreen').classList.add('hidden');
      $('#mainScreen').classList.remove('hidden');
      render();
      startMemberSync();
      showToast('Koneksi sedang bermasalah. Data akan disinkronkan kembali.');
    }
    return false;
  }
}
async function loadAll(){
  // Required identity check stays strict. Optional dashboard data should never block login.
  const results=await Promise.allSettled([
    rpc('member_me'),
    rpc('member_home'),
    rpc('member_catalog'),
    rpc('member_bookings',{p_limit:50}),
    rpc('member_history',{p_limit:100}),
    rpc('member_notifications',{p_limit:50}),
    rpc('member_points'),
    rpc('member_vouchers'),
    rpc('member_motor_catalog')
  ]);
  if(results[0].status!=='fulfilled')throw results[0].reason;
  const value=(i,fallback)=>results[i].status==='fulfilled'?results[i].value:fallback;
  const list=(i,previous)=>{const result=value(i,previous);return Array.isArray(result)?result:(Array.isArray(previous)?previous:[]);};
  state.member=results[0].value;
  state.home=value(1,state.home||{promotions:[]})||{promotions:[]};
  state.catalog=list(2,state.catalog);
  if(!state.catalog.length && results[2].status==='rejected'){
    try{const retry=await rpc('member_catalog');if(Array.isArray(retry))state.catalog=retry;}catch(e){console.warn('Member catalog retry unavailable');}
  }
  state.bookings=list(3,state.bookings);
  state.history=list(4,state.history);
  state.notifications=list(5,state.notifications);
  const points=value(6,state.points);
  state.points=points&&typeof points==='object'&&!Array.isArray(points)?points:{balance:0,rupiah_value:0,recent:[]};
  state.vouchers=list(7,state.vouchers);
  state.motorModels=list(8,state.motorModels);
  if($('#topName'))$('#topName').textContent=(state.member?.full_name||state.member?.username||'Starpoint Member')+' 👋';
  if($('#topMember'))$('#topMember').textContent=state.member?.member_code||'Member Starpoint';
  const unread=state.notifications.filter(n=>n&&!n.read_at).length;
  if($('#bellCount')){$('#bellCount').textContent=unread;$('#bellCount').classList.toggle('hidden',!unread);}
  try{
    const oldCache=JSON.parse(localStorage.getItem('spg_member_startup_cache')||'null');
    if(state.catalog.length){
      localStorage.setItem('spg_member_startup_cache',JSON.stringify({catalog:state.catalog,promotions:Array.isArray(state.home?.promotions)?state.home.promotions:[]}));
    }else if(Array.isArray(oldCache?.catalog) && oldCache.catalog.length){
      state.catalog=oldCache.catalog;
    }
  }catch(e){}
  const failedOptional=results.slice(1).filter(x=>x.status==='rejected').length;
  if(failedOptional)console.warn('Starpoint Member: optional dashboard requests unavailable; session retained');
}

let spgPromoTimer=null;
function initPromoCarousel(){
 if(spgPromoTimer){clearInterval(spgPromoTimer);spgPromoTimer=null;}
 if(state.page!=='home')return;
 const track=document.getElementById('spgPromoTrack');
 if(!track)return;
 const slides=[...track.querySelectorAll('.spg-promo-slide')];
 const dots=[...document.querySelectorAll('.spg-promo-dot')];
 if(slides.length<2)return;
 let index=0;
 const go=(i)=>{
  index=(i+slides.length)%slides.length;
  track.scrollTo({left:slides[index].offsetLeft-slides[0].offsetLeft,behavior:'smooth'});
  dots.forEach((dot,j)=>{dot.classList.toggle('active',j===index);dot.setAttribute('aria-current',j===index?'true':'false');});
 };
 dots.forEach((dot,i)=>{dot.onclick=()=>go(i);});
 track.addEventListener('scrollend',()=>{
  index=Math.max(0,Math.min(slides.length-1,Math.round(track.scrollLeft/Math.max(1,track.clientWidth))));
  dots.forEach((dot,j)=>{dot.classList.toggle('active',j===index);dot.setAttribute('aria-current',j===index?'true':'false');});
 });
 spgPromoTimer=setInterval(()=>{
  if(document.hidden||state.page!=='home'||!track.isConnected)return;
  go(index+1);
 },1500);
}

function promoBannerURL(path){
 const s=String(path||'');
 if(!/^promotions\/[0-9a-f-]{36}\/[0-9a-f-]{36}\.(jpg|jpeg|png|webp)$/.test(s))return '';
 return SUPABASE_URL+'/storage/v1/object/public/promo-banners/'+s.split('/').map(encodeURIComponent).join('/');
}
function spgBookingStillActive(b){
 if(!b||b.status==='cancelled')return false;
 if(b.transaction)return b.transaction.work_status!=='completed';
 return b.status==='pending'||b.status==='confirmed';
}

function memberVoucherLabel(v){if(v.voucher_type==='percent')return 'Diskon '+String(v.discount_percent||0)+'%';if(v.voucher_type==='free_ala_carte')return 'Free Ala Carte';return rupiah(v.amount||0);}
function memberVoucherTransactions(){
const out=new Map();
for(const t of [state.home?.active_job,...(state.history||[])]){
if(!t?.id||t.payment_status==='paid'||Number(t.points_redeemed||0)>0)continue;
const paid=Number(t.amount_paid||0),pending=Number(t.pending_payment||0),due=Math.max(0,Number(t.final_total||0)-paid-pending);
if(due<=0||paid>0||pending>0)continue;
if((state.vouchers||[]).some(v=>v.status==='used'&&String(v.used_transaction_id||'')===String(t.id)))continue;
out.set(String(t.id),{...t,due});
}
return [...out.values()];
}
async function useVoucher(id){
const v=(state.vouchers||[]).find(x=>String(x.id)===String(id));
if(!v||v.status!=='active'||v.reserved_booking_id||(v.expires_at&&new Date(v.expires_at).getTime()<=Date.now())){showToast('Voucher sudah tidak aktif');return;}
const jobs=memberVoucherTransactions();
if(!jobs.length){
openSheet('<div class="sheet-head"><h3>Gunakan Voucher</h3><button class="close" data-close>×</button></div><div class="card"><h4 style="margin:0 0 8px">'+esc(memberVoucherLabel(v))+'</h4><p style="color:var(--soft);font-size:14px;line-height:1.6">Belum ada tagihan yang dapat memakai voucher ini. Voucher tetap tersimpan dan bisa digunakan pada transaksi berikutnya sebelum pembayaran.</p></div><button class="btn btn-primary btn-block" data-close style="margin-top:14px">Mengerti</button>');
queryAll('[data-close]').forEach(b=>b.onclick=closeSheet);
return;
}
if(jobs.length===1){const j=jobs[0];openCheckoutVoucher(j.id,j.due,checkoutActiveVouchers(j.id),id);return;}
openSheet('<div class="sheet-head"><h3>Gunakan Voucher</h3><button class="close" data-close>×</button></div><div class="field"><label>Pilih tagihan untuk '+esc(memberVoucherLabel(v))+'</label><select id="voucherTransaction">'+jobs.map(j=>'<option value="'+esc(j.id)+'">'+esc(j.code||'Transaksi')+' · '+rupiah(j.due)+'</option>').join('')+'</select></div><button class="btn btn-primary btn-block" id="voucherPickNext">Lanjut Checkout</button>');

}

function serviceActivityHTML(){
const waiting=(state.bookings||[]).filter(b=>(b.status==='pending'||b.status==='confirmed')&&!b.transaction&&spgUpcomingBooking(b)).sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at)).slice(0,3);
const all=(state.history||[]).filter(j=>j&&j.id);
const latest=(arr)=>arr.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
const inProgress=latest(all.filter(j=>j.work_status==='in_progress'));
const pending=latest(all.filter(j=>j.work_status==='pending'));
const completed=latest(all.filter(j=>j.work_status==='completed')).slice(0,1);
const jobs=[...inProgress,...pending].slice(0,5).concat(completed);
let out='';
for(const booking of waiting){
out+='<div class="activity-card booking-active"><div class="activity-kicker">Menunggu Penerimaan Booking</div><div class="status-top"><div><h4>'+esc(booking.motor_name)+' · '+esc(booking.service_name)+'</h4><div class="meta"><span>'+esc(booking.code||'-')+'</span><span>•</span><span>'+dt(booking.scheduled_at)+'</span><span>•</span><span>'+esc(catLabel(booking.vehicle_category))+'</span></div></div><span class="badge pending">Menunggu</span></div><div class="spg-work-note">Booking belum diterima. Status pengerjaan akan tampil setelah booking dikonfirmasi.</div><button class="activity-link" data-pagego="booking">Lihat Booking ›</button></div>';
}
for(const job of jobs){
const title=(job.services||[]).map(s=>typeof s==='string'?s:s.name).filter(Boolean).join(' · ')||job.code;
const stage=workLabel(job.work_status);
out+='<div class="activity-card work-active"><div class="activity-kicker">Status Pekerjaan</div><div class="status-top"><div><h4>'+esc(job.motor_name)+' · '+esc(title)+'</h4><div class="meta"><span>'+esc(job.code||'-')+'</span><span>•</span><span>'+dmy(job.date)+'</span><span>•</span><span>'+payLabel(job.payment_status)+'</span></div></div><span class="badge '+esc(job.work_status)+'">'+stage+'</span></div>'+spgWorkProgress(job.work_status)+'<button class="activity-link" data-pagego="history">Lihat Detail Pekerjaan ›</button></div>';
}
return out?'<div class="activity-stack">'+out+'</div>':'';
}

function jobStatusCard(j){const step=j.work_status==='pending'?1:j.work_status==='in_progress'?2:3;const pending=Number(j.pending_payment||0),outstanding=Math.max(0,Number(j.final_total)-Number(j.amount_paid)),payable=Math.max(0,outstanding-pending);return `<div class="card status-card"><div class="status-top"><div><h4>${esc((j.services||[]).join(' · ')||j.code)}</h4><div class="meta"><span>${esc(j.motor_name)}</span><span>•</span><span>${esc(catLabel(j.vehicle_category))}</span></div></div><span class="badge ${j.work_status}">${workLabel(j.work_status)}</span></div>${spgWorkProgress(j.work_status)}<div class="row"><span>Status pembayaran</span><strong>${payLabel(j.payment_status)}</strong></div><div class="row"><span>Sisa tagihan</span><strong>${rupiah(outstanding)}</strong></div>${pending>0?`<div class="pay-pending">Menunggu konfirmasi pembayaran ${rupiah(pending)}</div>`:''}${payable>0?`<button class="btn btn-primary btn-block icon-btn-label" style="margin-top:3px" data-payjob="${j.id}" data-amount="${payable}">${ico('wallet')} Bayar Tagihan</button>`:''}</div>`;}
function promoCard(p){return `<div class="promo"><strong>${esc(p.title)}</strong><p>${esc(p.description||'Promo aktif Starpoint Garage.')}</p></div>`;}
function servicePrice(s,cat){const n=Number(s.prices?.[cat]||0);return n?rupiah(n):'Konsultasi';}
function serviceCard(s){return `<div class="card service-card"><div><h4>${esc(s.name)}</h4><p>${s.workshop_only?'Workshop':s.home_service_available?'Workshop / Home Service':'Starpoint Garage'}${s.requires_deposit?' · DP '+rupiah(s.deposit_amount):''}</p></div><div class="service-price">${servicePrice(s,state.bookingCat)}</div></div>`;}
function spgUpcomingBooking(b){const scheduled=Date.parse(b.scheduled_at||'');if(!Number.isFinite(scheduled))return false;const today=new Date(Date.now()+7*3600000);const start=Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),today.getUTCDate())-7*3600000;return scheduled>=start;}
function bookingHTML(){const active=state.bookings.filter(b=>b.status!=='cancelled'&&b.status!=='completed'&&spgUpcomingBooking(b));const past=state.bookings.filter(b=>b.status==='cancelled'||b.status==='completed'||!spgUpcomingBooking(b));return `<div class="headline"><div><h2>Booking</h2><p>Jadwal dan status layanan</p></div><button class="refresh" data-act="newbooking" aria-label="Tambah booking">${ico('plus')}</button></div><button class="btn btn-primary btn-block icon-btn-label" data-act="newbooking">${ico('calendar')} Booking Layanan</button><div class="section"><div class="section-title"><h3>Booking Aktif</h3></div><div class="list">${active.length?active.map(b=>bookingCard(b,false)).join(''):'<div class="empty">Belum ada booking aktif.</div>'}</div></div>${past.length?`<div class="section"><div class="section-title"><h3>Riwayat Booking</h3></div><div class="list">${past.map(b=>bookingCard(b,false)).join('')}</div></div>`:''}`;}
function bookingCard(b,compact=false){
  const paid=Number(b.confirmed_dp||0),pending=Number(b.pending_dp||0);
  const need=Math.max(0,Number(b.deposit_amount||0)-paid-pending);
  const autoRejected=b.status==='cancelled'&&!!b.cancellation_reason;
  const statusText=autoRejected?'Ditolak Otomatis':(b.status==='confirmed'&&!spgUpcomingBooking(b)?'Jadwal Lewat':bookingLabel(b.status));
  let paymentState='';
  if(b.status==='pending'&&b.deposit_required&&!b.transaction){
    if(pending>0) paymentState='<div class="payment-state submitted">Bukti pembayaran sudah dikirim dan sedang diperiksa.</div>';
    else if(paid>=Number(b.deposit_amount||0)) paymentState='<div class="payment-state confirmed">Pembayaran sudah dikonfirmasi. Menunggu booking diterima.</div>';

async function preparePaymentProof(file){
  if(!file)throw new Error('Pilih foto bukti pembayaran');
  if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Bukti harus berupa JPG, PNG, atau WebP');
  if(file.size<=4500000)return file;
  try{
    const bitmap=await createImageBitmap(file);
    const max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));
    canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
    bitmap.close();
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(v=>v?resolve(v):reject(new Error('Foto tidak dapat diproses')),'image/jpeg',.84));
    if(blob.size>5000000)throw new Error('Ukuran bukti pembayaran maksimal 5 MB');
    return new File([blob],'bukti-pembayaran.jpg',{type:'image/jpeg'});
  }catch(e){
    if(file.size>5000000)throw new Error('Ukuran bukti pembayaran maksimal 5 MB');
    return file;
  }
}
function sessionUserId(){
  try{
    const raw=state.session?.access_token?.split('.')[1]||'';
    const normalized=raw.replace(/-/g,'+').replace(/_/g,'/');
    const padded=normalized+'='.repeat((4-normalized.length%4)%4);
    return JSON.parse(atob(padded)).sub||'';
  }catch{return '';}
}
async function uploadPaymentProof(file,bookingId){
  const prepared=await preparePaymentProof(file);
  const uid=sessionUserId();
  if(!uid)throw new Error('Sesi login tidak valid');
  const ext=prepared.type==='image/png'?'png':prepared.type==='image/webp'?'webp':'jpg';
  const path=`${uid}/${bookingId}/${Date.now()}-${crypto.randomUUID().slice(0,8)}.${ext}`;
  const url=SUPABASE_URL+'/storage/v1/object/payment-proofs/'+path.split('/').map(encodeURIComponent).join('/');
  const send=()=>fetch(url,{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+state.session.access_token,'Content-Type':prepared.type,'x-upsert':'false'},body:prepared});
  let response=await send();
  if(response.status===401){await refreshSession();response=await send();}
  if(!response.ok){
    let message='Bukti pembayaran gagal diunggah';
    try{const data=await response.json();message=data.message||data.error||message;}catch{}
    throw new Error(message);
  }
  return path;
}

let requestSeq=0,allowed=false;
function totals(discount=0,starting=original){
box.innerHTML='<div class="row"><span>Total sebelum voucher</span><strong>'+rupiah(starting)+'</strong></div><div class="row"><span>Potongan voucher</span><strong>'+(discount?'-'+rupiah(discount):rupiah(0))+'</strong></div><div class="row"><span>Total setelah voucher</span><strong>'+rupiah(Math.max(0,starting-discount))+'</strong></div>';
}
async function preview(){
const seq=++requestSeq,voucherId=select.value;
allowed=false;button.disabled=!!voucherId;
if(!voucherId){totals();hint.textContent=choices.length?'Voucher opsional. Lanjut tanpa voucher atau pilih salah satu untuk melihat diskon.':(alreadyPaid?'Voucher tidak berlaku setelah pembayaran pertama.':pending>0?'Tunggu konfirmasi pembayaran untuk memakai voucher.':'Tidak ada voucher aktif yang tersedia.');button.textContent='Lanjut Bayar';return;}
hint.textContent='Memeriksa voucher...';totals();
try{
const p=await rpc('member_preview_voucher',{p_voucher_id:voucherId,p_transaction_id:id});
if(seq!==requestSeq)return;
if(p?.eligible){
totals(Number(p.discount_amount||0),Number(p.original_total||original));
allowed=true;button.disabled=false;button.textContent='Gunakan Voucher & Lanjut';
hint.textContent='Voucher memberikan potongan '+rupiah(p.discount_amount)+'. Konfirmasi untuk menerapkan.';
}else{
allowed=false;button.disabled=true;button.textContent='Voucher tidak berlaku';
hint.textContent=p?.reason||'Voucher tidak dapat digunakan pada tagihan ini.';
}
}catch(e){if(seq!==requestSeq)return;allowed=false;button.disabled=true;button.textContent='Voucher tidak berlaku';hint.textContent=errText(e);}
}
select.onchange=preview;
button.onclick=async()=>{
const voucherId=select.value;
if(voucherId&&!allowed)return;
button.disabled=true;
if(!voucherId){closeSheet();openJobPaymentCore(id,amount);return;}
button.textContent='Menerapkan Voucher...';
let result;
try{result=await rpc('member_use_voucher',{p_voucher_id:voucherId,p_transaction_id:id});}
catch(e){hint.textContent=errText(e);button.textContent='Coba Lagi';await preview();return;}
closeSheet();
try{await loadAll();render();}catch(e){showToast('Voucher berhasil dipakai. Muat ulang untuk memperbarui saldo.');}
const remaining=Number(result.remaining||0);
if(remaining>0){openJobPaymentCore(id,remaining);showToast('Voucher berhasil · hemat '+rupiah(result.discount_amount));}
else{showToast('Voucher berhasil · tagihan lunas');}
};
preview();
}
function openJobPaymentCore(id,amount){
const item=(state.history||[]).find(x=>x.id===id)||state.home?.active_job||{};
const finalTotal=Number(item.final_total||amount),potential=Math.floor(finalTotal/10000),bal=Number(state.points?.balance||0);
const hasVoucher=(state.vouchers||[]).some(v=>v.status==='used'&&String(v.used_transaction_id||'')===String(id));
const maxPts=hasVoucher?0:Math.min(bal,Math.floor(amount/1000));
if(maxPts>0){
openSheet('<div class="sheet-head"><h3>Bayar Tagihan</h3><button class="close" data-close>×</button></div><div class="card"><div class="row"><span>Sisa tagihan</span><strong>'+rupiah(amount)+'</strong></div><div class="row"><span>Starpoint Point</span><strong>'+bal+' Point</strong></div></div><div class="point-potential">'+ico('points')+' Setelah lunas kamu berpotensi mendapat <strong>'+potential+' Point</strong>.</div><div class="field"><label>Gunakan Point</label><input id="usePoints" type="number" min="0" max="'+maxPts+'" value="0" inputmode="numeric"></div><div class="meta"><span>Maksimal '+maxPts+' Point · 1 Point = Rp1.000</span></div><button class="btn btn-dark btn-block icon-btn-label" id="applyPoints" style="margin-top:12px">'+ico('points')+' Gunakan Point</button><button class="btn btn-primary btn-block" id="skipPoints" style="margin-top:9px">Lanjut Bayar Tanpa Point</button>');
$('#applyPoints').onclick=async()=>{const pts=Math.max(0,Math.min(maxPts,Number($('#usePoints').value||0)));if(!pts){showToast('Masukkan jumlah Point');return;}if(!confirm('Gunakan '+pts+' Point untuk potongan '+rupiah(pts*1000)+'?'))return;const b=$('#applyPoints');b.disabled=true;try{const res=await rpc('member_redeem_points',{p_transaction_id:id,p_points:pts});closeSheet();await loadAll();const remaining=Number(res.remaining||0);if(remaining>0)paymentSheet('Bayar Tagihan',remaining,method=>rpc('member_submit_job_payment',{p_transaction_id:id,p_method:method,p_amount:remaining}),{potential:Math.floor(Number(res.new_final_total||0)/10000)});else{render();showToast('Tagihan lunas dengan Starpoint Point');}}catch(e){showToast(errText(e));b.disabled=false;}};
$('#skipPoints').onclick=()=>{closeSheet();paymentSheet('Bayar Tagihan',amount,method=>rpc('member_submit_job_payment',{p_transaction_id:id,p_method:method,p_amount:amount}),{potential,benefitNotice:hasVoucher?'Voucher sudah digunakan. Starpoint Point tidak dapat digabungkan.':null});};
return;
}
paymentSheet('Bayar Tagihan',amount,method=>rpc('member_submit_job_payment',{p_transaction_id:id,p_method:method,p_amount:amount}),{potential,benefitNotice:hasVoucher?'Voucher sudah digunakan. Starpoint Point tidak dapat digabungkan.':null});
}
function openReschedule(id){openSheet(`<div class="sheet-head"><h3>Ubah Jadwal</h3><button class="close" data-close>×</button></div><div class="field"><label>Jadwal Baru</label><input id="rsDate" type="datetime-local"></div><button class="btn btn-primary btn-block" id="rsSave">Simpan Jadwal</button>`);$('#rsSave').onclick=async()=>{const v=$('#rsDate').value;if(!v){showToast('Pilih jadwal baru');return;}const d=new Date(v);if(d.getHours()<9||d.getHours()>=18){showToast('Pilih jadwal antara 09:00–18:00');return;}const b=$('#rsSave');b.disabled=true;try{await rpc('member_reschedule_booking',{p_booking_id:id,p_new_scheduled_at:d.toISOString()});closeSheet();await reloadData();showToast('Jadwal diperbarui');}catch(e){showToast(errText(e));b.disabled=false;}};}
function openBilling(){const rows=state.history.filter(h=>h.payment_status!=='paid');openSheet(`<div class="sheet-head"><h3>Tagihan</h3><button class="close" data-close>×</button></div><div class="list">${rows.length?rows.map(h=>{const pending=Number(h.pending_payment||0),due=Math.max(0,Number(h.final_total)-Number(h.amount_paid)-pending);return `<div class="card"><div class="row"><span>${esc(h.code)}<br><small>${dmy(h.date)}</small></span><strong>${rupiah(Math.max(0,Number(h.final_total)-Number(h.amount_paid)))}</strong></div><div class="meta"><span>${payLabel(h.payment_status)}</span></div>${pending>0?`<div class="pay-pending">Menunggu konfirmasi ${rupiah(pending)}</div>`:''}${due>0?`<button class="btn btn-primary btn-block" data-payjob="${h.id}" data-amount="${due}" style="margin-top:10px">Bayar</button>`:''}</div>`;}).join(''):'<div class="empty">Tidak ada tagihan aktif.</div>'}</div>`);queryAll('[data-payjob]').forEach(b=>b.onclick=()=>openJobPayment(b.dataset.payjob,Number(b.dataset.amount)));}
function openProfile(){const m=state.member||{};openSheet(`<div class="sheet-head"><h3>Edit Profil</h3><button class="close" data-close>×</button></div><div class="field"><label>Nama</label><input id="pfName" value="${esc(m.full_name||m.username)}"></div><div class="field"><label>Tanggal Lahir</label><input id="pfBirth" type="date" value="${esc(m.birth_date||'')}"></div><div class="card" style="margin:12px 0"><div class="row"><span>WhatsApp terdaftar</span><strong>${esc(m.phone||'-')}</strong></div></div><button class="btn btn-primary btn-block" id="pfSave">Simpan Profil</button>`);$('#pfSave').onclick=async()=>{const b=$('#pfSave');b.disabled=true;try{state.member=await rpc('member_update_profile',{p_full_name:$('#pfName').value.trim(),p_phone:m.phone||null,p_birth_date:$('#pfBirth').value||null});closeSheet();await reloadData();showToast('Profil diperbarui');}catch(e){showToast(errText(e));b.disabled=false;}};}
async function quickLinkPhone(){}
function openVehicle(){openSheet(`<div class="sheet-head"><h3>Tambah Motor</h3><button class="close" data-close>×</button></div><div class="field"><label>Nama Motor</label><input id="vhName" placeholder="Contoh: NMAX"></div><div class="field"><label>Kategori</label><select id="vhCat">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div><button class="btn btn-primary btn-block" id="vhSave">Simpan Motor</button>`);$('#vhSave').onclick=async()=>{const name=$('#vhName').value.trim();if(!name){showToast('Nama motor wajib diisi');return;}const b=$('#vhSave');b.disabled=true;try{await rpc('member_add_vehicle',{p_motor_name:name,p_vehicle_category:$('#vhCat').value,p_make_primary:true});closeSheet();await reloadData();showToast('Motor ditambahkan');}catch(e){showToast(errText(e));b.disabled=false;}};}
async function deleteVehicle(id){if(!confirm('Hapus motor ini dari akun?'))return;try{await rpc('member_delete_vehicle',{p_vehicle_id:id});await reloadData();showToast('Motor dihapus');}catch(e){showToast(errText(e));}}
function openNotifications(){openSheet(`<div class="sheet-head"><h3>Notifikasi</h3><button class="close" data-close>×</button></div><div class="list">${state.notifications.length?state.notifications.map(n=>`<div class="card"><strong>${esc(n.title)}</strong><p style="margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.45">${esc(n.body)}</p><div class="meta"><span>${dt(n.created_at)}</span></div></div>`).join(''):'<div class="empty">Belum ada notifikasi.</div>'}</div>`);rpc('member_mark_notifications_read').then(()=>{state.notifications.forEach(n=>n.read_at=n.read_at||new Date().toISOString());$('#bellCount').classList.add('hidden');}).catch(()=>{});}
loadSaved();
if(state.session?.access_token){
  document.documentElement.classList.add('spg-restoring-session');
  $('#authScreen').classList.add('hidden');
  $('#mainScreen').classList.remove('hidden');
  try{
    const cached=JSON.parse(localStorage.getItem('spg_member_startup_cache')||'null');
    if(cached&&Array.isArray(cached.catalog)){
      state.catalog=cached.catalog;
      state.home={promotions:Array.isArray(cached.promotions)?cached.promotions:[]};
    }
  }catch(e){}
  state.page='home';
  render();
  enterApp();
}else{
  document.documentElement.classList.remove('spg-restoring-session');
}
</script>
<script id="spg-startup-gate-v2">(function(){const splash=document.getElementById('spg-startup');if(!splash)return;let finished=false,probe=null,fallback=null,closing=false;function finish(){if(finished)return;finished=true;clearInterval(probe);clearTimeout(fallback);splash.classList.add('spg-finished');setTimeout(()=>splash.remove(),250)}function ready(){if(closing||finished)return;let active=false;try{active=Boolean(typeof state!=='undefined'&&state&&state.session&&state.session.access_token)}catch{}const auth=document.getElementById('authScreen'),main=document.getElementById('mainScreen');const authVisible=Boolean(auth&&!auth.classList.contains('hidden'));const mainVisible=Boolean(main&&!main.classList.contains('hidden'));if((!active&&authVisible)||(active&&mainVisible)){closing=true;setTimeout(finish,160)}}probe=setInterval(ready,80);fallback=setTimeout(finish,14000);ready()})();</script><script id="spg-live-payment-countdown-59">(function(){'use strict';function update(){document.querySelectorAll('[data-payment-deadline]').forEach(function(el){var t=Date.parse(el.getAttribute('data-payment-deadline')||'');if(!Number.isFinite(t))return;var seconds=Math.max(0,Math.ceil((t-Date.now())/1000));el.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');});}setInterval(update,1000);document.addEventListener('visibilitychange',update);update();})();</script></body>
