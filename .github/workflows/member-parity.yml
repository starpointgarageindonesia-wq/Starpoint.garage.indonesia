name: Check Starpoint Member parity
on:
  push:
    branches: [main]
    paths:
      - index.html
      - member.html
      - public/index.html
      - public/member.html
      - public/assets/app-services/**
      - scripts/check-member-parity.mjs
      - .github/workflows/member-parity.yml
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-member:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production Member integration
        run: node scripts/check-member-parity.mjs
